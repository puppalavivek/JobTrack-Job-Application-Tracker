<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Job Application</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<h1>Add New Job Application</h1>

{% if saved %}
    <h3>Application saved successfully!</h3>
{% endif %}

<form class="job-form" action="/add" method="POST">

    <label>Company Name:</label>
    <input type="text" name="company" required>
    <br><br>

    <label>Job Role:</label>
    <input type="text" name="role" required>
    <br><br>

    <label>Location:</label>
    <input type="text" name="location">
    <br><br>

    <label>Application Date:</label>
    <input type="date" name="date">
    <br><br>

    <hr>
    <h3>📅 Interview Details</h3>

    <label>Interview Date:</label>
    <input type="date" name="interview_date">
    <br><br>

    <label>Interview Time:</label>
    <input type="time" name="interview_time">
    <br><br>

    <label>Status:</label>
    <select name="status">
        <option value="Applied">Applied</option>
        <option value="Interview">Interview</option>
        <option value="Selected">Selected</option>
        <option value="Rejected">Rejected</option>
    </select>

    <br><br>

    <button type="submit">Save Application</button>

</form>

<br>

<a href="{{ url_for('home') }}">Back to Dashboard</a>

</body>
</html>
