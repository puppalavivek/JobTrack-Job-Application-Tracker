<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Job Application</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<h1>Edit Job Application</h1>

<form class="job-form" method="POST">

    <label>Company Name:</label>
    <input type="text"
           name="company"
           value="{{ job.company }}"
           required>
    <br><br>

    <label>Job Role:</label>
    <input type="text"
           name="role"
           value="{{ job.role }}"
           required>
    <br><br>

    <label>Location:</label>
    <input type="text"
           name="location"
           value="{{ job.location or '' }}">
    <br><br>

    <label>Application Date:</label>
    <input type="date"
           name="date"
           value="{{ job.date or '' }}">
    <br><br>

    <hr>
    <h3>📅 Interview Details</h3>

    <label>Interview Date:</label>
    <input type="date"
           name="interview_date"
           value="{{ job.interview_date or '' }}">
    <br><br>

    <label>Interview Time:</label>
    <input type="time"
           name="interview_time"
           value="{{ job.interview_time or '' }}">
    <br><br>

    <label>Status:</label>

    <select name="status">

        <option value="Applied"
            {% if job.status == 'Applied' %}selected{% endif %}>
            Applied
        </option>

        <option value="Interview"
            {% if job.status == 'Interview' %}selected{% endif %}>
            Interview
        </option>

        <option value="Selected"
            {% if job.status == 'Selected' %}selected{% endif %}>
            Selected
        </option>

        <option value="Rejected"
            {% if job.status == 'Rejected' %}selected{% endif %}>
            Rejected
        </option>

    </select>

    <br><br>

    <button type="submit">Update Application</button>

</form>

<br>

<a href="{{ url_for('home') }}">Back to Dashboard</a>

</body>
</html>
